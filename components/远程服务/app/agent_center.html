:root{color-scheme:light;--bg:#f1f5fa;--surface:#fff;--text:#24354b;--muted:#687b92;--line:#d9e2ee;--soft:#e5effe;--accent:#2869d9;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}

margin:8px 0;background:var(--surface)}.job summary{cursor:pointer}.job pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}.file{display:block;margin-top:7px;max-width:100%;overflow-wrap:anywhere}#composer{position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(5px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}#input{display:block;width:100%;padding:10px 12px;resize:vertical;min-height:65px;max-height:25dvh;line-height:1.6}.send-row{justify-content:flex-end;margin-top:8px;flex-wrap:wrap}.send-row small{flex:1;min-width:100px}#response-options{font-size:12px;margin-bottom:8px}#response-options label{display:inline-flex;align-items:center;gap:5px;margin:5px 8px 5px 0;max-width:100%}#target{max-width:100%}#error{position:sticky;bottom:0;background:var(--surface);border:1px solid #c27f64;border-radius:10px;padding:10px;white-space:pre-wrap}dialog{color:var(--text);background:var(--surface);width:calc(100% - 28px);max-width:440px;max-height:85dvh;overflow:auto;border:1px solid var(--line);border-radius:16px;padding:20px}dialog::backdrop{background:#101c2c99}dialog label{display:grid;gap:5px;margin:12px 0}button:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.sr-only{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}@media(max-width:360px){main{padding:8px}.partner-tools{gap:5px}button,select{padding:7px 9px}}
input{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px;min-width:0}#history-tools{margin:8px 0;font-size:12px}#history-tools>label{display:block;margin:7px 0}#history-search,#title-input{width:100%;min-height:44px}.archive-choice{display:flex!important;align-items:center;gap:8px;margin:12px 0}.archive-choice input{width:18px;height:18px}#manage-dialog label{display:grid;gap:5px}

.failure{border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.failure>div{flex:1;min-width:150px}.failure small{display:block;font-size:12px;margin-top:4px}.failure details{flex-basis:100%;font-size:12px;overflow-wrap:anywhere}.failure summary{cursor:pointer}
.cooperation-turn{margin-bottom:20px}
.round-work,.round-output{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-width:0}
.round-work{border-inline-start:3px solid var(--line)}
.round-work[data-state=prepared]{border-inline-start-color:var(--accent)}
.round-heading{display:flex;align-items:baseline;justify-content:space-between;gap:6px;flex-wrap:wrap}
.round-checklist{list-style:none;margin:8px 0;padding:0;display:grid;gap:7px}
.round-checklist li{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:0 0 6px}
.round-checklist li>span{font-size:12px;color:var(--accent);flex-shrink:0}
.round-checklist small,.round-output>small{display:block}
.cooperation-turn details[data-panel]{font-size:13px;padding:6px 0}
.cooperation-turn>details[data-panel]{padding-inline:8px}
.round-approval{border-top:1px solid var(--line);margin-top:6px;text-align:end}
.round-approval p{text-align:start;font-size:12px;color:var(--muted)}
.round-approval button{margin:0 0 4px 5px}
.round-deliveries h3{font-size:14px;margin:11px 0 5px}
.round-output{margin-bottom:7px}
.round-text{white-space:pre-wrap;margin-top:5px;overflow-wrap:anywhere}
#plan-dialog textarea,#plan-dialog select{width:100%;min-width:0;padding:7px 10px}
#plan-dialog label{margin:6px 0;font-size:13px}
#plan-dialog[open]{display:flex;flex-direction:column;padding:0;overflow:hidden}
#plan-form{display:flex;flex:1;flex-direction:column;min-height:0;margin:0}
#plan-title{margin:0;padding:14px 16px 8px}
#plan-fields{min-height:0;padding:0 16px 12px;overflow:auto;overscroll-behavior:contain;scroll-padding-block:8px}
#plan-actions{flex:none;padding:8px 16px;border-top:1px solid var(--line);background:var(--surface)}
#plan-actions .send-row{margin:0}
.phone-plan-job{min-width:0;margin:10px 0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;display:grid;grid-template-columns:1fr 1fr;gap:2px 8px}
.phone-plan-job>label:first-of-type,.phone-plan-job>label:last-of-type{grid-column:1/-1}
.phone-plan-job input{min-height:42px}
#plan-error{color:var(--text);border-inline-start:3px solid var(--accent);padding-inline-start:8px}
@media(max-width:350px){.phone-plan-job{grid-template-columns:1fr}}

</head><body><main id="partner-app">
<header class="partner-head"><a id="back">‹ 工作站</a><strong>搭档群聊</strong><button id="refresh" type="button">刷新</button></header>
<div class="partner-tools"><select id="sessions" aria-label="群聊记录"><option value="">选择群聊</option></select><button id="new" type="button">新建</button><button id="theme" type="button" aria-label="切换深浅主题">◐</button></div>

<p id="status" role="status">正在连接电脑…</p><div id="members" aria-label="群聊成员"></div>
<section id="feed" aria-label="聊天记录" tabindex="0"></section>
<form id="composer"><details id="response-options"><summary>接话设置</summary><label>回应成员<select id="target" aria-label="回应成员"></select></label><label>轮数<select id="rounds" aria-label="接话轮数"><option>1</option><option>2</option><option>4</option><option>6</option></select></label><p id="budget"></p></details>
<label class="sr-only" for="input">发给搭档们</label><textarea id="input" maxlength="4000" rows="3" placeholder="聊聊想法，或直接交办一件事。"></textarea>
<div class="send-row"><small id="hint">模型连接与头像设置在电脑端。</small><button id="plan-jump" type="button" hidden>定位本轮</button><button id="plan-new" type="button" hidden>交办任务</button><button id="dragon-draft" type="button" hidden>请龙娘拟分工</button><button id="stop" type="button" hidden>停止本轮</button><button id="send" class="primary" type="submit">发送</button></div></form>
<p id="error" role="alert" hidden></p>
<dialog id="create-dialog"><form id="create-form"><h2>新建群聊</h2><p>使用电脑上已配置的模型。</p><label>成员 A<select id="member-a" required></select></label><label>成员 B<select id="member-b" required></select></label><label>成员 C（可选）<select id="member-c"></select></label><div class="send-row"><button id="cancel-create" type="button">取消</button><button id="create" class="primary" type="submit">开始群聊</button></div></form></dialog>
<dialog id="manage-dialog"><form id="manage-form"><h2>会话管理</h2><label>会话名称<input id="title-input" maxlength="60" required></label><label class="archive-choice"><input id="archive-input" type="checkbox">归档此会话</label><p>归档保留聊天与成果，恢复后可继续发送。</p><div class="send-row"><button id="cancel-manage" type="button">取消</button><button id="save-manage" class="primary" type="submit">保存会话设置</button></div></form></dialog>
<dialog id="plan-dialog" aria-labelledby="plan-title"><form id="plan-form">
<h2 id="plan-title">交办任务</h2>
<div id="plan-fields" data-dialog-scroll>
<label for="plan-goal">要完成什么</label><textarea id="plan-goal" rows="3" maxlength="8000" required></textarea>
<div id="plan-jobs"></div>
<button id="plan-add" type="button">添加子任务</button>
</div>
<footer id="plan-actions">
<p id="plan-error" role="alert" hidden></p>
<div class="send-row"><button id="plan-close" type="button">返回</button><button id="plan-prepare" class="primary" type="submit">检查分工</button></div>
</footer>
</form></dialog>
</main>
